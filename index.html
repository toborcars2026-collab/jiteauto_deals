    <!-- Critical Brand CSS: Enforces deep navy background from byte 0, eliminating white initial screen -->
    <style id="jite-critical-branding">
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background-color: #020617 !important;
        color: #f8fafc;

      #root {

      /* Premium Initial Brand Loading Experience */
      #jite-initial-loader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #020617;
        background-image: 
          radial-gradient(ellipse 70% 45% at 50% 0%, rgba(230, 165, 1, 0.12), transparent 70%),
          radial-gradient(ellipse 60% 50% at 50% 100%, rgba(15, 23, 42, 0.9), transparent 70%);
        color: #ffffff;
        padding: 24px;
        box-sizing: border-box;
        opacity: 1;
        visibility: visible;
        transition: opacity 320ms cubic-bezier(0.16, 1, 0.3, 1), visibility 320ms ease;
        will-change: opacity, visibility;
      }
      #jite-initial-loader.jite-loader-fade-out {
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }
      .jite-loader-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;

        width: 100%;
      }

        font-weight: 900;
        letter-spacing: -0.03em;
        line-height: 1.15;
        color: #ffffff;
        margin: 0;
        text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);

        width: 130px;

        border-radius: 9999px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 16px rgba(230, 165, 1, 0.25);
      }
      .jite-loader-indicator-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 45%;
        background: linear-gradient(90deg, #F3C330, #E6A501, #C28700);
        border-radius: 9999px;
        animation: jiteGoldTrack 1.3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        box-shadow: 0 0 10px #E6A501;

      @keyframes jiteGoldTrack {

        <div class="jite-loader-indicator" role="progressbar" aria-label="Loading Jite Auto Deals">

        </div>
        <span class="jite-loader-caption">Preparing your experience...</span>
      </div>
    </div>

    <div id="root"></div>

    <script>
      // Global smooth dismissal handler called when React mounts
      window.__dismissInitialLoader = function() {
        var loader = document.getElementById('jite-initial-loader');
        if (loader && !loader.classList.contains('jite-loader-fade-out')) {
          loader.classList.add('jite-loader-fade-out');
          setTimeout(function() {
            if (loader && loader.parentNode) {
              loader.parentNode.removeChild(loader);
            }
          }, 360);
        }
      };
      // Safety fail-safe timeout so loader never hangs under extreme network drops
      setTimeout(function() {
        if (typeof window.__dismissInitialLoader === 'function') {
          window.__dismissInitialLoader();
        }
      }, 4000);

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function(err) {
            console.warn('SW registration skipped:', err);
          });
        });
      }
    </script>
